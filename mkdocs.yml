site_name: Turfware Help
site_url: https://tobyh82.github.io/turfware-guides/
site_description: Turfware user guides — orders, delivery, harvesting, setup & integrations
docs_dir: docs
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
  logo: assets/logo.svg
  favicon: assets/favicon.png
extra_css:
  - assets/turfware.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Home: index.md
  - "Web App":
    - web-app/index.md
    - "Getting around":
      - "Global Search": web-app/global-search.md
